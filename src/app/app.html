<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar__logo">
      <img src="https://entheospace.co/assets/images/logo.png" alt="Entheospace Logo" class="sidebar__logo-img" />
      <h1>{{ title() }}</h1>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav">
      <ul class="sidebar__menu">
        <!-- Purchase Orders (Home) -->
        <li>
          <a
            routerLink="/purchase-orders"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar__link"
          >
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
            <span>Purchase Orders</span>
          </a>
        </li>

        <!-- Create Order -->
        <li>
          <a
            routerLink="/purchase-orders/new"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="sidebar__link"
          >
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            <span>New Order</span>
          </a>
        </li>

        <!-- Admin Section -->
        <li class="sidebar__section">
          <button
            (click)="toggleAdminMenu()"
            class="sidebar__toggle"
          >
            <div class="sidebar__toggle__left">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              <span>Admin</span>
            </div>
            <svg
              class="sidebar__toggle__icon"
              [class.open]="isAdminMenuOpen()"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          <!-- Admin Submenu -->
          @if (isAdminMenuOpen()) {
            <ul class="sidebar__submenu">
              <li>
                <a
                  routerLink="/admin/part-numbers"
                  routerLinkActive="active"
                >
                  <span>Part Numbers</span>
                </a>
              </li>
              <li>
                <a
                  routerLink="/admin/cedis"
                  routerLinkActive="active"
                >
                  <span>CEDIS</span>
                </a>
              </li>
              <li>
                <a
                  routerLink="/admin/locations"
                  routerLinkActive="active"
                >
                  <span>Locations</span>
                </a>
              </li>
              <li>
                <a
                  routerLink="/admin/inventory"
                  routerLinkActive="active"
                >
                  <span>Inventory</span>
                </a>
              </li>
            </ul>
          }
        </li>
      </ul>
    </nav>

    <!-- Footer -->
    <div class="sidebar__footer">
      <p>ERP System v1.0.0</p>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header -->
    <header class="main-content__header">
      <h2>Dashboard</h2>
    </header>

    <!-- Page Content -->
    <div class="main-content__body">
      <router-outlet />
    </div>
  </main>
</div>
